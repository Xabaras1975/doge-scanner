name: Doge Scanner Workflow

on:
  schedule:
    - cron: '0 */5 * * *'  # Si riavvia in automatico ogni 5 ore
  workflow_dispatch:        # Ti permette di avviarlo a mano quando vuoi con un pulsante

permissions:
  contents: write  # FONDAMENTALE: dà il permesso di salvare il file di memoria nel repo

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa Dipendenze
        run: |
          pip install requests numpy

      - name: Esegui Scanner DOGE
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner_doge.py

      - name: Salva Memoria nel Repository Git
        if: always()  # Salva il file anche se il processo termina o viene interrotto
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add doge_memory.json
          git commit -m "Aggiornamento memoria DOGE [skip ci]" || exit 0
          git push
